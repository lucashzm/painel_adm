<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Administrativo - Decoralar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
<aside class="menu">
<h2>DECORALAR</h2>
<nav>
<a href="index.html">Dashboard</a>
<a href="pedidos.html">Pedidos</a>
<a href="clientes.html">Clientes</a>
</nav>
</aside>
<main>
<header><h1>Painel Administrativo</h1><p>Acompanhamento de vendas, entregas e financeiro</p></header>
<section class="dashboard-status-cards">
  <article class="dashboard-card dashboard-entrega">
    <div class="dashboard-card-header"><div><span class="dashboard-kicker">OPERAÇÃO</span><h2>🚚 Status de entrega</h2></div><span class="dashboard-total" id="totalEntrega">0</span></div>
    <div class="dashboard-status-list" id="statusEntrega">
      <div class="dashboard-status-row"><span class="status-badge entrega-pendente">Pendente</span><strong>0</strong></div>
      <div class="dashboard-status-row"><span class="status-badge entrega-reservado">Reservado</span><strong>0</strong></div>
      <div class="dashboard-status-row"><span class="status-badge entrega-aguardando-entrega">Aguardando entrega</span><strong>0</strong></div>
      <div class="dashboard-status-row"><span class="status-badge entrega-concluido">Concluído</span><strong>0</strong></div>
    </div>
  </article>
  <article class="dashboard-card dashboard-financeiro">
    <div class="dashboard-card-header"><div><span class="dashboard-kicker">FINANCEIRO</span><h2>💰 Status financeiro</h2></div><span class="dashboard-total" id="totalFinanceiro">0</span></div>
    <div class="dashboard-status-list" id="statusFinanceiro">
      <div class="dashboard-status-row"><span class="status-badge financeiro-pendente">Pendente</span><strong>0</strong></div>
      <div class="dashboard-status-row"><span class="status-badge financeiro-pagamento-na-entrega">Pagamento na entrega</span><strong>0</strong></div>
      <div class="dashboard-status-row"><span class="status-badge financeiro-pago">Pago</span><strong>0</strong></div>
    </div>
  </article>
</section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
