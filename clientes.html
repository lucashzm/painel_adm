<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes - Decoralar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
<aside class="menu">
<h2>DECORALAR</h2>
<nav>
<a href="index.html">Dashboard</a>
<a href="pedidos.html">Pedidos</a>
<a href="clientes.html" class="menu-ativo">Clientes</a>
</nav>
</aside>
<main>
<header>
<h1>Clientes</h1>
<p>Pesquise os clientes cadastrados pelos dados abaixo.</p>
</header>
<section class="clientes-filtros">
<div class="clientes-filtro">
<label for="filtroNome">Nome</label>
<input id="filtroNome" placeholder="Nome do cliente">
</div>
<div class="clientes-filtro">
<label for="filtroCpf">CPF/CNPJ</label>
<input id="filtroCpf" placeholder="CPF ou CNPJ">
</div>
<div class="clientes-filtro">
<label for="filtroTelefone">Telefone</label>
<input id="filtroTelefone" placeholder="Telefone">
</div>
<div class="clientes-filtro">
<label for="filtroEmail">E-mail</label>
<input id="filtroEmail" type="email" placeholder="E-mail">
</div>
<div class="clientes-filtro">
<label for="filtroData">Data de cadastro</label>
<input id="filtroData" type="date">
</div>
<div class="clientes-acoes">
<button id="pesquisarClientes" class="btn btn-pesquisar">Pesquisar</button>
<button id="limparFiltros" class="btn btn-limpar">Limpar</button>
</div>
</section>
<section class="clientes-lista" id="listaClientes"><div class="clientes-vazio">Informe um ou mais campos e clique em Pesquisar.</div></section>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
