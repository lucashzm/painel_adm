<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pedidos - Decoralar</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="layout">
<aside class="menu"><h2>DECORALAR</h2><nav><a href="index.html">Dashboard</a><a href="pedidos.html">Pedidos</a></nav></aside>
<main>
<h1>Pedidos</h1>
<section class="filtros">
<input id="buscaPedido" placeholder="Número do pedido">
<input id="buscaCliente" placeholder="Cliente ou CPF/CNPJ">
<select id="filtroVendedor"><option value="">Todos vendedores</option></select>
<select id="filtroEntrega">
<option value="">Status entrega</option>
<option>Pendente</option><option>Novo pedido</option><option>Reservado</option><option>Pronto para entrega</option><option>Entregue</option><option>Cancelado</option>
</select>
<select id="filtroFinanceiro">
<option value="">Status financeiro</option>
<option>Pendente</option><option>Aguardando pagamento</option><option>Pagamento na entrega</option><option>Pago</option><option>Cancelado</option>
</select>
<input id="dataInicial" type="date">
<input id="dataFinal" type="date">
<div class="acoes-filtro"><button id="pesquisarPedidos" class="btn btn-pesquisar">Pesquisar</button><button id="limparFiltros" class="btn btn-limpar">Limpar</button></div>
</section>
<table>
<thead><tr><th>Pedido</th><th>Cliente</th><th>Vendedor</th><th>Valor</th><th>Entrega</th><th>Financeiro</th><th>Data</th><th>Ações</th></tr></thead>
<tbody id="listaPedidos"></tbody>
</table>
</main>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/pedidos.js"></script>
</body>
</html>
